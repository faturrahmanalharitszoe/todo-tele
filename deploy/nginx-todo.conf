upstream todo_dashboard {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    listen [::]:80;
    server_name todo.faturrahmanalharitszoe.my.id;

    # Setelah certbot jalan, blok ini bakal otomatis nambah redirect ke HTTPS.

    access_log /var/log/nginx/todo-dashboard.access.log;
    error_log  /var/log/nginx/todo-dashboard.error.log;

    location / {
        proxy_pass http://todo_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

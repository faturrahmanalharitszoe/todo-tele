<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} · Buku Catatan</title>
  <style>
    :root {
      --paper: #f4f1e9; --ink: #1b1a16; --ink-soft: #6c6456;
      --rule: #d8d1c2; --accent: #9b2c22;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html[data-theme="dark"] {
      --paper: #15140f; --ink: #e8e2d4; --ink-soft: #9c937f; --rule: #2e2b23; --accent: #e08a6f;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--paper); }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: var(--ink); font-family: var(--sans); padding: 24px;
    }
    .card { max-width: 460px; border-top: 2px solid var(--ink); padding-top: 16px; }
    .code { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
    h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; margin: 6px 0 10px; }
    p { color: var(--ink-soft); margin: 0 0 18px; }
    a.back {
      display: inline-block; text-decoration: none; color: var(--ink);
      border-bottom: 1px solid var(--ink); padding-bottom: 1px;
    }
    a.back:hover { color: var(--accent); border-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>Halaman yang diminta gak bisa ditampilin. Coba balik ke daftar catatan, atau muat ulang sebentar lagi.</p>
    <a class="back" href="/">Kembali ke Buku Catatan</a>
  </div>
</body>
</html>
